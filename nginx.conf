server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # ── Health check ─────────────────────────────────────────────────
    location /healthz {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # ── API proxy → admin-service ────────────────────────────────────
    # ADMIN_API_URL은 docker-entrypoint.sh가 envsubst로 치환 (K8s env → nginx)
    # 개발기 기본값: http://localhost:8085
    # stage: http://admin-service.sb-stage-app-ns.svc.cluster.local:8085
    location /api/ {
        proxy_pass ${ADMIN_API_URL};
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── SPA fallback ────────────────────────────────────────────────
    # React Router(BrowserRouter)는 서버 측 경로를 모르므로
    # /assets/ 정적파일만 직접 서빙, 나머지는 index.html로 fallback.
    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
