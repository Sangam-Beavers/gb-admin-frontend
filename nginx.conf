server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # K8s CoreDNS IP — docker-entrypoint.sh 가 /etc/resolv.conf 에서 읽어 ${KUBE_DNS_IP}로 주입.
    # proxy_pass 에 변수($admin_backend)를 쓰면 nginx 기동 시 DNS 조회를 하지 않아
    # admin-service 가 미배포 상태여도 nginx 는 정상 기동되고 SPA 자체는 서빙된다.
    resolver ${KUBE_DNS_IP} valid=30s ipv6=off;

    # ── Health check ─────────────────────────────────────────────────
    location /healthz {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # ── API proxy → admin-service ────────────────────────────────────
    location /api/ {
        set $admin_backend "${ADMIN_API_URL}";
        proxy_pass $admin_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── Static assets ────────────────────────────────────────────────
    location /assets/ {
        try_files $uri =404;
    }

    # ── SPA fallback ─────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
